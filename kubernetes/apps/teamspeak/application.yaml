apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamspeak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sacrede-mgn/home-infra.git
    targetRevision: HEAD
    path: kubernetes/teamspeak
  destination:
    server: https://kubernetes.default.svc
    namespace: teamspeak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true