apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: v26.1.0
    helm:
      values: |
        service:
          enabled: true
          type: LoadBalancer          
          annotations:
            metallb.universe.tf/address-pool: first-pool 
            metallb.universe.tf/loadBalancerIPs: 192.168.4.241
        ports:
          web:
            port: 80
            expose: true
          websecure:
            port: 443
            expose: true
        logs:
          access:
            enabled: true
            addInternals: true
          general:
            level: INFO
        experimental:
          plugins:
            crowdsec-bouncer-traefik-plugin:
              moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
              version: v1.3.0
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
            publishedService:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true