apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuwunel
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sacrede-mgn/home-infra.git
    targetRevision: HEAD
    path: kubernetes/tuwunel
  destination:
    server: https://kubernetes.default.svc
    namespace: tuwunel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
