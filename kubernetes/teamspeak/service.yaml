apiVersion: v1
kind: Service
metadata:
  name: teamspeak
  namespace: teamspeak
  annotations:
spec:
  type: LoadBalancer
  selector:
    app: teamspeak
  ports:
    - name: voice
      port: 9987
      targetPort: 9987
      protocol: UDP
    - name: serverquery
      port: 10011
      targetPort: 10011
      protocol: TCP
    - name: filetransfer
      port: 30033
      targetPort: 30033
      protocol: TCP