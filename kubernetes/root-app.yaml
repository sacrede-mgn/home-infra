apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sacrede-mgn/home-lab.git
    targetRevision: HEAD
    path: kubernetes/apps
    directory:
      recurse: true          # включает поиск .yaml во всех поддиректориях
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true