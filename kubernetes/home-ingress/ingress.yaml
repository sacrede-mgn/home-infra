---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only-whitelist
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - "192.168.4.0/24"
      - "10.0.0.0/8"    

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-lan-only-whitelist@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - headlamp.home.onishenko.tk
    secretName: headlamp-tls
  rules:
  - host: headlamp.home.onishenko.tk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlamp
            port:
              number: 80