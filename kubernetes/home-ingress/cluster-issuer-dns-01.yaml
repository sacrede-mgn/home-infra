apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alex@onishenko.tk
    privateKeySecretRef:
      name: letsencrypt-prod-dns-private-key
    solvers:
    - dns01:
        cloudflare:
          email: alex@onishenko.tk
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token