apiVersion: apps/v1
kind: Deployment
metadata:
  name: socks5-proxy
  namespace: socks5-proxy
  labels:
    app: socks5-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: socks5-proxy
  template:
    metadata:
      labels:
        app: socks5-proxy
    spec:
      containers:
      - name: socks5
        image: gogost/gost:latest
        imagePullPolicy: IfNotPresent
        args:
          - "-C"
          - "/etc/gost/gost.yaml"
        ports:
        - containerPort: 1080
          name: socks5
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/gost
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: socks5-config