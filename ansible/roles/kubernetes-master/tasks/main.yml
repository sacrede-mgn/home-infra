---
- name: Initialize Kubernetes cluster
  ansible.builtin.command: kubeadm init 
  args:
    creates: /etc/kubernetes/admin.conf
  tags: init

- name: Create .kube directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0750'
  tags: init

- name: Copy kubeconfig to user directory
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  tags: init

- name: Set correct ownership on kubeconfig
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  tags: init

# ===== Проверка доступности API =====
- name: "⏳ Wait for Kubernetes API server"
  ansible.builtin.command: kubectl cluster-info
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: api_ready
  until: api_ready.rc == 0
  retries: 30
  delay: 5
  tags: init

# ===== Calico CNI =====
- name: "🌐 Install Calico CNI plugin"
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: init

- name: "⏳ Wait for Calico to be ready"
  ansible.builtin.command: kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: init

- name: "✅ Verify Calico installation"
  ansible.builtin.command: kubectl get pods -n kube-system -l k8s-app=calico-node
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_status
  tags: init

- name: "📋 Display Calico status"
  ansible.builtin.debug:
    msg: "Calico pods status: {{ calico_status.stdout }}"
  tags: init

# ===== MetalLB =====
- name: "🔧 Install MetalLB"
  ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: metallb_install
  changed_when: "'created' in metallb_install.stdout or 'configured' in metallb_install.stdout"
  tags: addons

- name: "⏳ Wait for MetalLB controller and speaker pods"
  ansible.builtin.command: kubectl wait --for=condition=ready pod -l app=metallb -n metallb-system --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: addons

- name: "📝 Create MetalLB IPAddressPool and L2Advertisement"
  ansible.builtin.copy:
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: first-pool
        namespace: metallb-system
      spec:
        addresses:
        - 192.168.4.240-192.168.4.250
      ---
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: example
        namespace: metallb-system
      spec:
        ipAddressPools:
        - first-pool
    dest: /tmp/metallb-config.yaml
    mode: '0644'
  tags: addons

- name: "🔧 Apply MetalLB configuration"
  ansible.builtin.command: kubectl apply -f /tmp/metallb-config.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: addons

- name: "🗑️ Remove temporary MetalLB config file"
  ansible.builtin.file:
    path: /tmp/metallb-config.yaml
    state: absent
  tags: addons

# ===== ArgoCD =====
- name: "📦 Install ArgoCD"
  ansible.builtin.command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"
  tags: addons

- name: "⏳ Wait for ArgoCD initial admin secret"
  ansible.builtin.command: kubectl -n argocd get secret argocd-initial-admin-secret
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: secret_check
  until: secret_check.rc == 0
  retries: 30
  delay: 5
  tags: addons

- name: "🔑 Retrieve ArgoCD admin password"
  ansible.builtin.command: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: argocd_password
  tags: addons

- name: "📝 Display ArgoCD admin password"
  ansible.builtin.debug:
    msg: |
      ArgoCD admin password: {{ argocd_password.stdout }}
      Access ArgoCD UI via NodePort or port-forward:
      kubectl port-forward -n argocd service/argocd-server 8080:443
      Then open https://localhost:8080
  tags: addons


# ===== Sealed Secrets =====
- name: "🔐 Install Sealed Secrets controller"
  ansible.builtin.command: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/controller.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sealed_secrets_install
  changed_when: "'created' in sealed_secrets_install.stdout or 'configured' in sealed_secrets_install.stdout"
  tags: addons

- name: "⏳ Wait for Sealed Secrets controller pod"
  ansible.builtin.command: kubectl wait --for=condition=ready pod -l name=sealed-secrets-controller -n kube-system --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: addons

- name: "🔧 Install kubeseal CLI"
  ansible.builtin.get_url:
    url: https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/kubeseal-linux-amd64
    dest: /usr/local/bin/kubeseal
    mode: '0755'
  tags: addons

- name: "🔑 Retrieve Sealed Secrets public certificate"
  ansible.builtin.command: kubeseal --fetch-cert --controller-namespace kube-system --controller-name sealed-secrets-controller
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: sealed_secrets_cert
  changed_when: false
  tags: addons

- name: "📁 Save public certificate for future use"
  ansible.builtin.copy:
    content: "{{ sealed_secrets_cert.stdout }}"
    dest: "/home/{{ ansible_user }}/sealed-secrets-cert.pem"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  tags: addons

- name: "📋 Sealed Secrets installation summary"
  ansible.builtin.debug:
    msg:
      - "Sealed Secrets controller installed and ready."
      - "Public certificate saved to /home/{{ ansible_user }}/sealed-secrets-cert.pem"
      - "Use `kubeseal --cert /home/{{ ansible_user }}/sealed-secrets-cert.pem` to seal your secrets."
  tags: addons

# ===== Настройка ArgoCD как LoadBalancer =====
- name: "🔄 Patch ArgoCD server service to LoadBalancer"
  ansible.builtin.command: kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"LoadBalancer"}}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: patch_result
  changed_when: "'patched' in patch_result.stdout"
  tags: addons

- name: "⏳ Wait for LoadBalancer IP assignment"
  ansible.builtin.shell: |
    kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: lb_ip
  until: lb_ip.stdout != ""
  retries: 30
  delay: 5
  tags: addons

- name: "📋 Display ArgoCD LoadBalancer IP"
  ansible.builtin.debug:
    msg: |
      ArgoCD server is accessible via LoadBalancer at: http://{{ lb_ip.stdout }}
      Use the admin password from previous step to log in.
  tags: addons